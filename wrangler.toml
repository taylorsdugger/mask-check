name = "mask-check"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# public/ is the dashboard. Anything that isn't a file there (like /api/report)
# falls through to the Worker.
[assets]
directory = "./public"

[observability]
enabled = true

# Holds the latest report, so the dashboard doesn't wait on CDC's slow api,
# and the last threat level that was emailed. Create it once with
#   npx wrangler kv namespace create STATE
# and paste the id here. Local dev works without it.
[[kv_namespaces]]
binding = "STATE"
id = "3d88b13be04a4527a9bd4b356d22a57e"

[vars]
EMAIL_FROM = "Mask Check <mask-check@taylordugger.com>"
# "normal" or "cautious". Cautious treats a Low wastewater level as Moderate.
CAUTION = "normal"
# "true" sends every morning. Otherwise mornings only send when a rating
# changed since the last email, plus the weekly Friday email.
SEND_EVERY_DAY = "false"
DASHBOARD_URL = "https://mask-check.taylordugger.com"

# Cron runs in UTC, so each send time has a daylight and a standard time
# trigger and only the one that lands on Chicago's hour sends. 12:30/13:30 is
# 7:30am Central. 17:30/18:30 on Fridays is 12:30pm, after CDC's wastewater
# update, which lands around 10am Central.
[triggers]
crons = ["30 12 * * *", "30 13 * * *", "30 17 * * 5", "30 18 * * 5"]

# Each morning's ratings, so the dashboard can chart the season and the email
# can say what changed since yesterday. Tables are in migrations/.
[[d1_databases]]
binding = "DB"
database_name = "mask-check"
database_id = "3d8ae75b-77d7-473a-b872-83c181dab4ec"
